<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowWRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- judgment layer -->
  <rect x="20" y="20" width="860" height="110" rx="10" fill="#fafafa" stroke="#e8e8e8"/>
  <text x="36" y="44" font-size="10.5" font-style="italic" fill="#999999">Judgment · Human</text>
  <rect x="60" y="52" width="230" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="175" y="76" text-anchor="middle" font-size="14" fill="#111111">User input</text>
  <text x="175" y="96" text-anchor="middle" font-size="10" fill="#777777">idea / setting doc</text>
  <rect x="590" y="52" width="240" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="710" y="76" text-anchor="middle" font-size="14" fill="#111111">Author</text>
  <text x="710" y="96" text-anchor="middle" font-size="10" fill="#777777">review · edit · reject · continue</text>

  <!-- generation layer -->
  <rect x="20" y="150" width="860" height="440" rx="10" fill="#ffffff" stroke="#e8e8e8"/>
  <text x="36" y="174" font-size="10.5" font-style="italic" fill="#999999">Generation · Machine</text>

  <!-- Pipeline container -->
  <rect x="50" y="190" width="800" height="290" rx="10" fill="#fcfcfc" stroke="#222222" stroke-width="1.4"/>
  <text x="70" y="216" font-size="13" font-weight="600" fill="#111111">Pipeline orchestrator — owns all flow control</text>

  <!-- step chain -->
  <rect x="90" y="246" width="130" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="155" y="282" text-anchor="middle" font-size="14" fill="#111111">Preprocess</text>
  <rect x="294" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="349" y="282" text-anchor="middle" font-size="14" fill="#111111">Outline</text>
  <rect x="478" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="533" y="282" text-anchor="middle" font-size="14" fill="#111111">Beat</text>
  <rect x="662" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="717" y="282" text-anchor="middle" font-size="14" fill="#111111">Prose</text>

  <!-- gates -->
  <polygon points="258,258 276,276 258,294 240,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="258" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>
  <polygon points="442,258 460,276 442,294 424,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="442" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>
  <polygon points="626,258 644,276 626,294 608,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="626" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>

  <line x1="220" y1="276" x2="238" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <line x1="276" y1="276" x2="292" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <line x1="404" y1="276" x2="422" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <line x1="460" y1="276" x2="476" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <line x1="588" y1="276" x2="606" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <line x1="644" y1="276" x2="660" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>

  <text x="450" y="330" text-anchor="middle" font-size="10.5" fill="#8a2d2d">gate: AI output pending → author reviews → approved · no pass, no advance</text>

  <!-- seams -->
  <rect x="90" y="356" width="350" height="44" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="108" y="383" font-size="11" font-weight="600" fill="#555555">storage seam</text>
  <text x="190" y="383" font-size="11" fill="#444444" font-family="'SF Mono', Menlo, monospace">InMemoryStore │ SQLiteStore (#9)</text>
  <rect x="470" y="356" width="350" height="44" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="488" y="383" font-size="11" font-weight="600" fill="#555555">step seam</text>
  <text x="570" y="383" font-size="11" fill="#444444" font-family="'SF Mono', Menlo, monospace">FakeStep │ RealStep</text>

  <!-- input → preprocess -->
  <line x1="175" y1="108" x2="175" y2="242" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>

  <!-- gate ↔ author -->
  <line x1="442" y1="252" x2="640" y2="112" stroke="#8a2d2d" stroke-width="1" stroke-dasharray="4 4" marker-start="url(#arrowWRed)" marker-end="url(#arrowWRed)"/>

  <!-- artifacts -->
  <line x1="450" y1="480" x2="450" y2="504" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowW)"/>
  <rect x="300" y="508" width="300" height="56" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="450" y="532" text-anchor="middle" font-size="13" fill="#111111">Store · versioned artifacts</text>
  <text x="450" y="552" text-anchor="middle" font-size="10" fill="#777777">appendArtifact · every version kept</text>
</svg>
