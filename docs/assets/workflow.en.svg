<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="800" viewBox="0 0 1080 800" role="img" aria-labelledby="workflow-title workflow-desc" font-family="Georgia, 'Times New Roman', serif">
  <title id="workflow-title">Pipeline, author gates and current storage boundary</title>
  <desc id="workflow-desc">Caption, selected Creative, approved Outline and complete Setting form the current workflow. Setting edits stay on the page until one atomic approval of the same artifact version. The current endpoint is setting-approved. Per-chapter Beat and Prose are planned in issue 5, and SQLite is planned in issue 9.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="author-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="800" fill="#ffffff"/>
  <rect x="20" y="20" width="1040" height="110" rx="10" fill="#fafafa" stroke="#e8e8e8"/>
  <text x="36" y="43" font-size="11" font-style="italic" fill="#999999">Judgment · Human</text>
  <rect x="60" y="54" width="220" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="170" y="78" text-anchor="middle" font-size="14" fill="#111111">User input</text>
  <text x="170" y="98" text-anchor="middle" font-size="10" fill="#777777">idea / document</text>
  <rect x="760" y="54" width="260" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="890" y="78" text-anchor="middle" font-size="14" fill="#111111">Author</text>
  <text x="890" y="98" text-anchor="middle" font-size="10" fill="#777777">select · edit · approve</text>

  <rect x="20" y="150" width="1040" height="628" rx="10" fill="#ffffff" stroke="#e8e8e8"/>
  <text x="36" y="174" font-size="11" font-style="italic" fill="#999999">Generation · Machine</text>
  <rect x="50" y="190" width="980" height="465" rx="10" fill="#fcfcfc" stroke="#222222" stroke-width="1.4"/>
  <text x="70" y="216" font-size="13" font-weight="600" fill="#111111">Pipeline — ordered steps and author gates</text>

  <!-- Current generation chain. Human connectors meet every current gate. -->
  <rect x="75" y="252" width="135" height="68" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="142.5" y="278" text-anchor="middle" font-size="14" fill="#111111">Caption</text>
  <text x="142.5" y="302" text-anchor="middle" font-size="10" fill="#777777">auto-approved</text>
  <rect x="240" y="252" width="135" height="68" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="307.5" y="278" text-anchor="middle" font-size="14" fill="#111111">Creative</text>
  <text x="307.5" y="302" text-anchor="middle" font-size="10" fill="#777777">direction packs</text>
  <polygon points="415,266 435,286 415,306 395,286" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="415" y="291" text-anchor="middle" font-size="12" fill="#8a2d2d">H</text>
  <text x="415" y="344" text-anchor="middle" font-size="10" fill="#8a2d2d">select one</text>
  <rect x="455" y="252" width="145" height="68" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="527.5" y="278" text-anchor="middle" font-size="14" fill="#111111">Outline</text>
  <text x="527.5" y="302" text-anchor="middle" font-size="10" fill="#777777">arcs + segments</text>
  <polygon points="640,266 660,286 640,306 620,286" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="640" y="291" text-anchor="middle" font-size="12" fill="#8a2d2d">H</text>
  <text x="640" y="344" text-anchor="middle" font-size="10" fill="#8a2d2d">approve</text>
  <rect x="680" y="252" width="170" height="68" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="765" y="274" text-anchor="middle" font-size="14" fill="#111111">Complete Setting</text>
  <text x="765" y="293" text-anchor="middle" font-size="10" fill="#777777">one whole generation</text>
  <text x="765" y="310" text-anchor="middle" font-size="10" fill="#777777">page-local edits</text>
  <polygon points="890,266 910,286 890,306 870,286" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="890" y="291" text-anchor="middle" font-size="12" fill="#8a2d2d">H</text>
  <text x="890" y="344" text-anchor="middle" font-size="10" fill="#8a2d2d">approve once</text>
  <g stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)">
    <line x1="210" y1="286" x2="236" y2="286"/>
    <line x1="375" y1="286" x2="391" y2="286"/>
    <line x1="435" y1="286" x2="451" y2="286"/>
    <line x1="600" y1="286" x2="616" y2="286"/>
    <line x1="660" y1="286" x2="676" y2="286"/>
    <line x1="850" y1="286" x2="866" y2="286"/>
  </g>
  <path d="M 60 82 H 40 V 286 H 71" fill="none" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <path d="M 890 114 V 234 H 415 V 262" fill="none" stroke="#8a2d2d" stroke-dasharray="4 4" marker-start="url(#author-arrow)" marker-end="url(#author-arrow)"/>
  <line x1="640" y1="234" x2="640" y2="262" stroke="#8a2d2d" stroke-dasharray="4 4" marker-end="url(#author-arrow)"/>
  <line x1="890" y1="234" x2="890" y2="262" stroke="#8a2d2d" stroke-dasharray="4 4" marker-end="url(#author-arrow)"/>
  <path d="M 910 286 H 1008 V 380 H 996" fill="none" stroke="#444444" marker-end="url(#arrow)"/>
  <rect x="744" y="365" width="248" height="30" rx="4" fill="#f3f3f3" stroke="#222222"/>
  <text x="868" y="385" text-anchor="middle" font-size="11" fill="#111111">Current end · setting-approved</text>

  <!-- Future steps are explicitly separated from the current terminal state. -->
  <rect x="80" y="415" width="700" height="133" rx="8" fill="#ffffff" stroke="#999999" stroke-dasharray="5 4"/>
  <text x="100" y="436" font-size="11" font-style="italic" fill="#888888">PLANNED · #5 · per-chapter loop</text>
  <path d="M 868 395 V 408 H 64 V 476 H 96" fill="none" stroke="#888888" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="100" y="451" width="120" height="50" rx="3" fill="#ffffff" stroke="#999999"/>
  <text x="160" y="481" text-anchor="middle" font-size="14" fill="#777777">Beat</text>
  <polygon points="260,458 278,476 260,494 242,476" fill="#ffffff" stroke="#8a2d2d"/>
  <text x="260" y="481" text-anchor="middle" font-size="11" fill="#8a2d2d">H</text>
  <rect x="305" y="451" width="120" height="50" rx="3" fill="#ffffff" stroke="#999999"/>
  <text x="365" y="481" text-anchor="middle" font-size="14" fill="#777777">Prose</text>
  <polygon points="465,458 483,476 465,494 447,476" fill="#ffffff" stroke="#8a2d2d"/>
  <text x="465" y="481" text-anchor="middle" font-size="11" fill="#8a2d2d">H</text>
  <rect x="540" y="451" width="200" height="50" rx="3" fill="#ffffff" stroke="#999999"/>
  <text x="640" y="481" text-anchor="middle" font-size="14" fill="#777777">Finished book</text>
  <g stroke="#888888" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <line x1="220" y1="476" x2="238" y2="476"/>
    <line x1="278" y1="476" x2="301" y2="476"/>
    <line x1="425" y1="476" x2="443" y2="476"/>
    <line x1="483" y1="476" x2="536" y2="476"/>
    <path d="M 465 494 V 528 H 160 V 505" fill="none"/>
  </g>
  <text x="315" y="522" text-anchor="middle" font-size="10" fill="#888888">next chapter</text>

  <rect x="80" y="568" width="440" height="60" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
  <text x="100" y="589" font-size="11" font-weight="600" fill="#555555">Storage adapter</text>
  <text x="100" y="613" font-size="11" fill="#444444">Current: InMemoryStore</text>
  <text x="300" y="613" font-size="11" fill="#888888">Planned: SQLite (#9)</text>
  <rect x="550" y="568" width="450" height="60" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-dasharray="4 3"/>
  <text x="570" y="589" font-size="11" font-weight="600" fill="#555555">Generation adapter</text>
  <text x="570" y="613" font-size="11" fill="#444444" font-family="'SF Mono', Menlo, monospace">FakeStep / RealStep</text>

  <line x1="540" y1="655" x2="540" y2="680" stroke="#444444" marker-end="url(#arrow)"/>
  <rect x="290" y="684" width="500" height="66" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="540" y="707" text-anchor="middle" font-size="13" fill="#111111">Store · artifacts (currently in memory)</text>
  <text x="540" y="731" text-anchor="middle" font-size="10.5" fill="#777777">Setting: append pending → finalize same id / version, approved</text>
  <text x="540" y="769" text-anchor="middle" font-size="10" fill="#777777">Setting is read-only after approval. Chapter generation and SQLite are not implemented.</text>
</svg>
