<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif">
  <defs>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowVRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- 判断层 · 人 -->
  <rect x="20" y="20" width="860" height="110" rx="10" fill="#fafafa" stroke="#e8e8e8"/>
  <text x="36" y="44" font-size="10.5" font-style="italic" fill="#999999">判断层 · 人</text>
  <rect x="60" y="52" width="230" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="175" y="76" text-anchor="middle" font-size="14" fill="#111111">用户输入</text>
  <text x="175" y="96" text-anchor="middle" font-size="10" fill="#777777">脑洞 / 上传设定文档</text>
  <rect x="590" y="52" width="240" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="710" y="76" text-anchor="middle" font-size="14" fill="#111111">作者</text>
  <text x="710" y="96" text-anchor="middle" font-size="10" fill="#777777">把关 · 修改 · 打回 · 续写</text>

  <!-- 生成层 · 机器 -->
  <rect x="20" y="150" width="860" height="440" rx="10" fill="#ffffff" stroke="#e8e8e8"/>
  <text x="36" y="174" font-size="10.5" font-style="italic" fill="#999999">生成层 · 机器</text>

  <!-- Pipeline 容器 -->
  <rect x="50" y="190" width="800" height="290" rx="10" fill="#fcfcfc" stroke="#222222" stroke-width="1.4"/>
  <text x="70" y="216" font-size="13" font-weight="600" fill="#111111">Pipeline 编排器 —— 拥有全部流程控制权</text>

  <!-- 步骤链 -->
  <rect x="90" y="246" width="130" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="155" y="282" text-anchor="middle" font-size="14" fill="#111111">预处理</text>
  <rect x="294" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="349" y="282" text-anchor="middle" font-size="14" fill="#111111">大纲</text>
  <rect x="478" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="533" y="282" text-anchor="middle" font-size="14" fill="#111111">章纲</text>
  <rect x="662" y="246" width="110" height="60" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="717" y="282" text-anchor="middle" font-size="14" fill="#111111">正文</text>

  <!-- 关卡菱形 -->
  <polygon points="258,258 276,276 258,294 240,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="258" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>
  <polygon points="442,258 460,276 442,294 424,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="442" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>
  <polygon points="626,258 644,276 626,294 608,276" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="626" y="280" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>

  <!-- 链上箭头 -->
  <line x1="220" y1="276" x2="238" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <line x1="276" y1="276" x2="292" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <line x1="404" y1="276" x2="422" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <line x1="460" y1="276" x2="476" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <line x1="588" y1="276" x2="606" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <line x1="644" y1="276" x2="660" y2="276" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>

  <!-- 关卡语义 -->
  <text x="450" y="330" text-anchor="middle" font-size="10.5" fill="#8a2d2d">关卡：AI 产出 pending → 作者把关 approved，不通过不前进</text>

  <!-- 两个接缝 -->
  <rect x="90" y="356" width="350" height="44" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="108" y="383" font-size="11" font-weight="600" fill="#555555">存储接缝</text>
  <text x="180" y="383" font-size="11" fill="#444444" font-family="'SF Mono', Menlo, monospace">InMemoryStore │ SQLiteStore（#9）</text>
  <rect x="470" y="356" width="350" height="44" rx="6" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="488" y="383" font-size="11" font-weight="600" fill="#555555">步骤接缝</text>
  <text x="560" y="383" font-size="11" fill="#444444" font-family="'SF Mono', Menlo, monospace">FakeStep │ RealStep</text>

  <!-- 用户输入 → 预处理 -->
  <line x1="175" y1="108" x2="175" y2="242" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>

  <!-- 关卡 ↔ 作者（两层唯一通道） -->
  <line x1="442" y1="252" x2="640" y2="112" stroke="#8a2d2d" stroke-width="1" stroke-dasharray="4 4" marker-start="url(#arrowVRed)" marker-end="url(#arrowVRed)"/>

  <!-- 产物落库 -->
  <line x1="450" y1="480" x2="450" y2="504" stroke="#444444" stroke-width="1.1" marker-end="url(#arrowV)"/>
  <rect x="300" y="508" width="300" height="56" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="450" y="532" text-anchor="middle" font-size="13" fill="#111111">Store · 版本化产物</text>
  <text x="450" y="552" text-anchor="middle" font-size="10" fill="#777777">appendArtifact · 历史版本可回读</text>
</svg>
