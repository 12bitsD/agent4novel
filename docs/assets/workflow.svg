<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="370" fill="#ffffff"/>

  <!-- author -->
  <rect x="880" y="36" width="150" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="955" y="61" text-anchor="middle" font-size="15" fill="#111111">作者</text>
  <text x="955" y="80" text-anchor="middle" font-size="10" fill="#777777">把关 · 编辑 · 续写</text>
  <path d="M 896 92 L 788 146" fill="none" stroke="#8a2d2d" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowRed)"/>
  <text x="838" y="112" text-anchor="middle" font-size="10" fill="#8a2d2d">关卡把关（不通过不前进）</text>

  <!-- pipeline -->
  <rect x="30" y="150" width="170" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
  <text x="115" y="179" text-anchor="middle" font-size="15" fill="#111111">Pipeline 编排器</text>
  <text x="115" y="201" text-anchor="middle" font-size="10.5" fill="#777777">固定顺序 · 强制关卡</text>

  <!-- step chain -->
  <rect x="260" y="150" width="120" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="320" y="190" text-anchor="middle" font-size="15" fill="#111111">预处理</text>
  <rect x="420" y="150" width="100" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="470" y="190" text-anchor="middle" font-size="15" fill="#111111">大纲</text>
  <rect x="560" y="150" width="100" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="610" y="190" text-anchor="middle" font-size="15" fill="#111111">章纲</text>
  <rect x="700" y="150" width="120" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="760" y="190" text-anchor="middle" font-size="15" fill="#111111">正文</text>

  <line x1="200" y1="185" x2="256" y2="185" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="380" y1="185" x2="416" y2="185" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="520" y1="185" x2="556" y2="185" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="660" y1="185" x2="696" y2="185" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>

  <!-- step zoom -->
  <path d="M 820 185 H 852" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="856" y="150" width="204" height="190" rx="10" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="958" y="172" text-anchor="middle" font-size="11" font-style="italic" fill="#888888">step 内部（放大）</text>
  <rect x="876" y="182" width="164" height="32" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="958" y="202" text-anchor="middle" font-size="11" fill="#111111">输入契约（zod 校验）</text>
  <line x1="958" y1="214" x2="958" y2="224" stroke="#444444" stroke-width="1" marker-end="url(#arrow2)"/>
  <rect x="876" y="228" width="164" height="44" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="958" y="248" text-anchor="middle" font-size="12.5" fill="#111111">Agent</text>
  <text x="958" y="264" text-anchor="middle" font-size="9.5" fill="#777777">LLM（AI SDK）+ SKILL.md 提示词</text>
  <line x1="958" y1="272" x2="958" y2="282" stroke="#444444" stroke-width="1" marker-end="url(#arrow2)"/>
  <rect x="876" y="286" width="164" height="32" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1"/>
  <text x="958" y="306" text-anchor="middle" font-size="11" fill="#111111">输出 {content}（zod 校验）</text>

  <!-- store -->
  <line x1="610" y1="220" x2="610" y2="264" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <text x="622" y="248" font-size="10" fill="#555555">产出落库</text>
  <rect x="420" y="270" width="300" height="56" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="570" y="294" text-anchor="middle" font-size="14" fill="#111111">Store（产物库）</text>
  <text x="570" y="313" text-anchor="middle" font-size="10" fill="#777777">全量版本化 · 人改即通过 · AI 产出待把关</text>

  <!-- notes -->
  <text x="30" y="330" font-size="11" font-style="italic" fill="#888888">测试与本地开发：内存存储 + FakeStep（不联网）；正式持久化：SQLite（#9）</text>
  <text x="30" y="348" font-size="11" font-style="italic" fill="#888888">模型接入：AI SDK registry，换 provider = 换一个字符串前缀</text>
</svg>
