<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="384" viewBox="0 0 1080 384" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a2d2d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="384" fill="#ffffff"/>

  <!-- two layers -->
  <rect x="12" y="24" width="1056" height="76" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="28" y="46" font-size="10.5" font-style="italic" fill="#999999">判断层 · 人</text>
  <rect x="12" y="116" width="1056" height="236" rx="8" fill="#ffffff" stroke="#e5e5e5"/>
  <text x="28" y="140" font-size="10.5" font-style="italic" fill="#999999">生成层 · 机器</text>

  <!-- author -->
  <rect x="790" y="38" width="170" height="48" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="875" y="59" text-anchor="middle" font-size="14" fill="#111111">作者</text>
  <text x="875" y="76" text-anchor="middle" font-size="9.5" fill="#777777">把关 · 编辑 · 续写</text>

  <!-- gate crossing: the only channel between the two layers -->
  <line x1="850" y1="88" x2="850" y2="164" stroke="#8a2d2d" stroke-width="1" stroke-dasharray="4 4" marker-start="url(#arrowRed)" marker-end="url(#arrowRed)"/>
  <polygon points="850,102 862,116 850,130 838,116" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="850" y="120" text-anchor="middle" font-size="11" fill="#8a2d2d">审</text>
  <text x="872" y="112" font-size="10" fill="#8a2d2d">关卡：不通过不前进</text>

  <!-- pipeline -->
  <rect x="30" y="170" width="170" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
  <text x="115" y="199" text-anchor="middle" font-size="15" fill="#111111">Pipeline 编排器</text>
  <text x="115" y="221" text-anchor="middle" font-size="10.5" fill="#777777">固定顺序 · 强制关卡</text>

  <!-- step chain -->
  <rect x="260" y="170" width="120" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="320" y="210" text-anchor="middle" font-size="15" fill="#111111">预处理</text>
  <rect x="420" y="170" width="100" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="470" y="210" text-anchor="middle" font-size="15" fill="#111111">大纲</text>
  <rect x="560" y="170" width="100" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="610" y="210" text-anchor="middle" font-size="15" fill="#111111">章纲</text>
  <rect x="700" y="170" width="120" height="70" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="760" y="210" text-anchor="middle" font-size="15" fill="#111111">正文</text>

  <line x1="200" y1="205" x2="256" y2="205" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="380" y1="205" x2="416" y2="205" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="520" y1="205" x2="556" y2="205" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <line x1="660" y1="205" x2="696" y2="205" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>

  <!-- step zoom -->
  <path d="M 820 205 H 852" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="856" y="170" width="204" height="170" rx="10" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="958" y="190" text-anchor="middle" font-size="11" font-style="italic" fill="#888888">step 内部（放大）</text>
  <rect x="876" y="200" width="164" height="32" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="958" y="220" text-anchor="middle" font-size="11" fill="#111111">输入契约（zod 校验）</text>
  <line x1="958" y1="232" x2="958" y2="242" stroke="#444444" stroke-width="1" marker-end="url(#arrow2)"/>
  <rect x="876" y="244" width="164" height="44" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="958" y="264" text-anchor="middle" font-size="12.5" fill="#111111">Agent</text>
  <text x="958" y="280" text-anchor="middle" font-size="9.5" fill="#777777">LLM（AI SDK）+ SKILL.md 提示词</text>
  <line x1="958" y1="288" x2="958" y2="298" stroke="#444444" stroke-width="1" marker-end="url(#arrow2)"/>
  <rect x="876" y="300" width="164" height="32" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1"/>
  <text x="958" y="320" text-anchor="middle" font-size="11" fill="#111111">输出 {content}（zod 校验）</text>

  <!-- store -->
  <line x1="610" y1="240" x2="610" y2="284" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <text x="622" y="268" font-size="10" fill="#555555">产出落库</text>
  <rect x="420" y="290" width="300" height="56" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="570" y="314" text-anchor="middle" font-size="14" fill="#111111">Store（产物库）</text>
  <text x="570" y="333" text-anchor="middle" font-size="10" fill="#777777">全量版本化 · 人改即通过 · AI 产出待把关</text>

  <!-- notes -->
  <text x="28" y="316" font-size="10.5" font-style="italic" fill="#888888">测试与本地开发：内存存储 + FakeStep（不联网）</text>
  <text x="28" y="334" font-size="10.5" font-style="italic" fill="#888888">正式持久化：SQLite（#9）· 模型接入：AI SDK registry</text>
</svg>
