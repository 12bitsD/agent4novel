<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" font-family="Georgia, 'Songti SC', 'Noto Serif CJK SC', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="340" fill="#ffffff"/>

  <!-- stage numbers -->
  <text x="72" y="124" text-anchor="middle" font-size="12" fill="#999">①</text>
  <text x="217" y="124" text-anchor="middle" font-size="12" fill="#999">②</text>
  <text x="385" y="124" text-anchor="middle" font-size="12" fill="#999">③</text>
  <text x="586" y="124" text-anchor="middle" font-size="12" fill="#999">④</text>

  <!-- nodes -->
  <rect x="20" y="140" width="104" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="72" y="162" text-anchor="middle" font-size="15" fill="#111111">统一入口</text>
  <text x="72" y="181" text-anchor="middle" font-size="10.5" fill="#777777">脑洞 / 上传文档</text>

  <rect x="158" y="140" width="118" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="217" y="162" text-anchor="middle" font-size="15" fill="#111111">预处理</text>
  <text x="217" y="181" text-anchor="middle" font-size="10" fill="#777777">提炼 → 创意 ×N</text>

  <rect x="310" y="140" width="150" height="56" rx="3" fill="#f3f3f3" stroke="#222222" stroke-width="1.2"/>
  <text x="385" y="162" text-anchor="middle" font-size="15" fill="#111111">创意稿</text>
  <text x="385" y="181" text-anchor="middle" font-size="10.5" fill="#777777">方向包 · 提炼稿自动通过</text>

  <!-- gate 1 -->
  <polygon points="500,146 522,168 500,190 478,168" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="500" y="173" text-anchor="middle" font-size="13" fill="#8a2d2d">审</text>
  <text x="500" y="216" text-anchor="middle" font-size="10" fill="#8a2d2d">创意比较选定</text>

  <rect x="540" y="140" width="92" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="586" y="162" text-anchor="middle" font-size="15" fill="#111111">大纲</text>
  <text x="586" y="181" text-anchor="middle" font-size="10.5" fill="#777777">分章 · 每章一句</text>

  <!-- chapter loop -->
  <rect x="656" y="80" width="330" height="170" rx="10" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="672" y="103" font-size="11" font-style="italic" fill="#888888">⑤ 每章循环 × N</text>

  <rect x="672" y="140" width="84" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="714" y="162" text-anchor="middle" font-size="15" fill="#111111">章纲</text>
  <text x="714" y="181" text-anchor="middle" font-size="10" fill="#777777">目标·冲突·钩子</text>

  <polygon points="792,146 814,168 792,190 770,168" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="792" y="173" text-anchor="middle" font-size="13" fill="#8a2d2d">审</text>
  <text x="792" y="216" text-anchor="middle" font-size="10" fill="#8a2d2d">章纲关卡</text>

  <rect x="828" y="140" width="84" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="870" y="162" text-anchor="middle" font-size="15" fill="#111111">正文</text>
  <text x="870" y="181" text-anchor="middle" font-size="10" fill="#777777">2000–4000 字</text>

  <polygon points="950,146 972,168 950,190 928,168" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.4"/>
  <text x="950" y="173" text-anchor="middle" font-size="13" fill="#8a2d2d">审</text>
  <text x="950" y="216" text-anchor="middle" font-size="10" fill="#8a2d2d">正文关卡</text>

  <rect x="1000" y="140" width="60" height="56" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.2"/>
  <text x="1030" y="173" text-anchor="middle" font-size="15" fill="#111111">完本</text>

  <!-- arrows -->
  <line x1="124" y1="168" x2="154" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="276" y1="168" x2="306" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="460" y1="168" x2="474" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="522" y1="168" x2="536" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="632" y1="168" x2="668" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="756" y1="168" x2="768" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="814" y1="168" x2="826" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="912" y1="168" x2="926" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>
  <line x1="972" y1="168" x2="996" y2="168" stroke="#444444" stroke-width="1.1" marker-end="url(#arrow)"/>

  <!-- next chapter dashed return -->
  <path d="M 950 190 V 278 H 714 V 202" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="832" y="272" text-anchor="middle" font-size="11" fill="#888888">下一章</text>

  <!-- legend -->
  <rect x="20" y="300" width="18" height="13" fill="#ffffff" stroke="#222222" stroke-width="1.1"/>
  <text x="44" y="311" font-size="11" fill="#555555">agent 步骤</text>
  <rect x="122" y="300" width="18" height="13" fill="#f3f3f3" stroke="#222222" stroke-width="1.1"/>
  <text x="146" y="311" font-size="11" fill="#555555">产物（版本化）</text>
  <polygon points="229,299 238,306.5 229,314 220,306.5" fill="#ffffff" stroke="#8a2d2d" stroke-width="1.2"/>
  <text x="246" y="311" font-size="11" fill="#555555">人工关卡（把关）</text>
  <line x1="386" y1="306.5" x2="416" y2="306.5" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="422" y="311" font-size="11" fill="#555555">按章循环</text>
</svg>
